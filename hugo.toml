baseURL = 'https://fech.in/blog/'
title = 'My Blog'
theme = 'PaperMod'
[pagination]
  pagerSize = 5

defaultContentLanguage = 'zh'

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true
  minifyOutput = true

[languages]
  [languages.zh]
    languageName = '中文'
    weight = 1
    title = '我的博客'
    [languages.zh.params]
      subtitle = '分享技术与生活'
      description = '一个分享技术与生活的个人博客'
    [[languages.zh.menu.main]]
      identifier = 'home'
      name = '首页'
      url = '/'
      weight = 1
    [[languages.zh.menu.main]]
      identifier = 'posts'
      name = '文章'
      url = 'posts/'
      weight = 2
    [[languages.zh.menu.main]]
      identifier = 'archives'
      name = '归档'
      url = 'archives/'
      weight = 3
    [[languages.zh.menu.main]]
      identifier = 'search'
      name = '搜索'
      url = 'search/'
      weight = 4

  [languages.en]
    languageName = 'English'
    weight = 2
    title = 'My Blog'
    [languages.en.params]
      subtitle = 'Sharing Tech & Life'
      description = 'A personal blog sharing tech and life'
    [[languages.en.menu.main]]
      identifier = 'home'
      name = 'Home'
      url = '/'
      weight = 1
    [[languages.en.menu.main]]
      identifier = 'posts'
      name = 'Posts'
      url = 'posts/'
      weight = 2
    [[languages.en.menu.main]]
      identifier = 'archives'
      name = 'Archives'
      url = 'archives/'
      weight = 3
    [[languages.en.menu.main]]
      identifier = 'search'
      name = 'Search'
      url = 'search/'
      weight = 4

[params]
  env = 'production'
  author = 'Author'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = 'Welcome'
    Content = 'A bilingual blog'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/'

[outputs]
  home = ['HTML', 'RSS', 'JSON']
